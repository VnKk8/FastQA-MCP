name: Publish to npm

# Runs when a GitHub release is published. Uses npm trusted publishing (OIDC):
# no npm token is stored in GitHub. Set it up once on npmjs.com under
# fastqa-mcp -> Settings -> Trusted publishing (workflow filename: publish.yml).

on:
  release:
    types: [published]

permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: Use npm 11.5.1 or newer (needed for trusted publishing)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION. Bump the version, push, then tag the release with $VERSION."
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.check.outputs.skip != 'true'
        run: npm test
      - if: steps.check.outputs.skip != 'true'
        run: npm publish
