name: Release

# Publishes fastqa-mcp to npm, then commits + tags the version and creates a GitHub release.
#
# Two ways to start it:
#   1. Manually: Actions -> Release -> Run workflow, then pick patch / minor / major
#      (or type an exact version such as 1.0.0).
#   2. Merging a pull request into main that has one of the labels
#      release:patch, release:minor or release:major. Merged PRs without one of
#      these labels publish nothing.
#
# npm side: uses trusted publishing (OIDC), so no npm token is stored in GitHub.
# Set it up once on npmjs.com: fastqa-mcp -> Settings -> Trusted publishing ->
# GitHub Actions, user VnKk8, repository FastQA-MCP, workflow publish.yml,
# and allow the "npm publish" action.
#
# MCP Registry side: after npm and GitHub are released, the "registry" job publishes server.json to the official
# MCP Registry as io.github.VnKk8/fastqa-mcp. It logs in with GitHub's OIDC token, so no secret is stored either.
# The registry checks that the npm package's "mcpName" matches the name in server.json. If only this job fails,
# re-run it: npm and GitHub are already done.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or an exact version instead, e.g. 1.0.0 (leave empty to use the bump above)
        type: string
        required: false
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide the version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$EXACT" ]; then RELEASE="${EXACT#v}"; else RELEASE="$BUMP"; fi
          else
            LABELS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq '[.[] | select(.merged_at != null) | .labels[].name] | join(",")')
            echo "Labels on the merged pull request: ${LABELS:-none}"
            case ",$LABELS," in
              *,release:major,*) RELEASE=major ;;
              *,release:minor,*) RELEASE=minor ;;
              *,release:patch,*) RELEASE=patch ;;
              *) RELEASE="" ;;
            esac
          fi
          if [ -z "$RELEASE" ]; then
            echo "::notice::No release:patch, release:minor or release:major label on a merged pull request, so nothing is published."
          else
            echo "Release: $RELEASE"
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  release:
    name: Publish to npm
    needs: plan
    if: needs.plan.outputs.release != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the version commit and tag, create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: Use npm 11.5.1 or newer (needed for trusted publishing)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Bump the version
        id: version
        env:
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          npm version "$RELEASE" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Choose a higher version."
            exit 1
          fi
          if npm view "fastqa-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "::error::fastqa-mcp@$VERSION is already on npm. Choose a higher version."
            exit 1
          fi
          # server.json (the MCP Registry entry) names the same version as package.json
          node -e "const fs = require('fs'); const j = JSON.parse(fs.readFileSync('server.json', 'utf8')); j.version = process.argv[1]; for (const p of j.packages) p.version = process.argv[1]; fs.writeFileSync('server.json', JSON.stringify(j, null, 2) + '\n');" "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test # also rebuilds dist/

      - name: Commit and tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server.json dist
          git commit -m "v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"

      # Publish before pushing: if npm refuses, nothing has changed on GitHub and the run can simply be retried.
      - run: npm publish

      - name: Push the version commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git push origin HEAD:main "v$VERSION"; then
            echo "::error::v$VERSION is on npm, but pushing the version commit to main failed (main changed during the run, or it is protected). Bump package.json to $VERSION on main by hand and push tag v$VERSION."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes \
            --notes "npm: https://www.npmjs.com/package/fastqa-mcp/v/$VERSION"

  registry:
    name: Publish to the MCP Registry
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # MCP Registry login with GitHub's OIDC token: grants the io.github.VnKk8 namespace
    env:
      # pinned on purpose, as the registry recommends; raise it deliberately, never use releases/latest
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.version }} # the tagged release commit, with server.json at this version

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      # npm can take a moment to show a new version to the registry's check, so a refusal is retried a few times
      - name: Publish server.json
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              echo "Published io.github.VnKk8/fastqa-mcp $VERSION to the MCP Registry"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          echo "::error::Could not publish to the MCP Registry. npm and GitHub already have v$VERSION; re-run this job once the cause above is fixed."
          exit 1
